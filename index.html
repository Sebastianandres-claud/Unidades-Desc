<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operación — Unidades Desconectadas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e1e6ec;
    --head-blue: #eaf2fb;
    --head-blue-text: #3a6ea5;
    --text: #23303f;
    --muted: #7c8798;
    --red: #e57373;
    --red-bg: #fbe1e1;
    --yellow: #d9a441;
    --yellow-bg: #fbeecb;
    --green: #4caf7d;
    --green-bg: #dcf3e6;
    --accent: #3a6ea5;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 32px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:12px;
  }

  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }

  header .clock{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 0 0 rgba(76,175,125,.5);
    animation:pulse 2s infinite;
  }
  .dot.offline{ background:var(--red); animation:none; }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(76,175,125,.4); }
    70%{ box-shadow:0 0 0 7px rgba(76,175,125,0); }
    100%{ box-shadow:0 0 0 0 rgba(76,175,125,0); }
  }

  main{
    padding:24px 32px 60px;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:20px;
    align-items:start;
  }

  @media (max-width: 980px){
    main{ grid-template-columns:1fr; }
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
  }

  .panel-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:14px 18px 10px;
  }

  .panel-title h2{
    margin:0;
    font-size:14.5px;
    font-weight:600;
  }

  .panel-title .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--accent);
    font-weight:600;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }

  thead th{
    text-align:left;
    padding:9px 14px;
    background:var(--head-blue);
    color:var(--head-blue-text);
    font-weight:600;
    font-size:12px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }

  tbody td{
    padding:8px 14px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }

  tbody tr:hover{ background:#f7f9fc; }

  .pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
  }

  .pill-red{ background:var(--red-bg); color:#b23b3b; }
  .pill-yellow{ background:var(--yellow-bg); color:#8a6212; }
  .pill-green{ background:var(--green-bg); color:#2f7a54; }

  .badge{
    display:inline-block;
    padding:3px 8px;
    border-radius:4px;
    font-size:11.5px;
    font-weight:600;
    background:#eef1f5;
    color:#54606e;
  }
  .badge-descarga{ background:#dcf3e6; color:#2f7a54; }
  .badge-calle{ background:#eaf2fb; color:#3a6ea5; }
  .badge-embarque{ background:#fdeecb; color:#93650e; }
  .badge-movimiento{ background:#e7e2fb; color:#5b3fa0; }
  .badge-revisar{ background:var(--red-bg); color:#b23b3b; }

  .empty-state, .error-state{
    padding:36px 20px;
    text-align:center;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .error-state{ color:#b23b3b; }

  .full-width{ grid-column:1 / -1; }

  footer{
    text-align:center;
    padding:16px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Operación — Unidades Desconectadas</h1>
    <div class="clock" id="opClock">—</div>
  </div>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">conectando</span>
  </div>
</header>

<main>
  <div class="panel full-width">
    <div class="panel-title">
      <h2>Movimientos y unidades en patio</h2>
      <span class="count" id="countGeneral">—</span>
    </div>
    <div id="tableGeneral"><div class="empty-state">cargando…</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>Unidades a bordo sin conexión</h2>
      <span class="count" id="countSinConexion">—</span>
    </div>
    <div id="tableSinConexion"><div class="empty-state">cargando…</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">
      <h2>Desconectadas para embarque</h2>
      <span class="count" id="countEmbarque">—</span>
    </div>
    <div id="tableEmbarque"><div class="empty-state">cargando…</div></div>
  </div>
</main>

<footer>actualiza cada 10 segundos · fuente: DESCONECTADOSBI.txt</footer>

<script>
  const RAW_URL = "https://raw.githubusercontent.com/Sebastianandres-claud/Unidades-Desc/main/DESCONECTADOSBI.txt";
  const REFRESH_MS = 10000;
  const CODIGOS_EXCLUIDOS = ["TIP", "TQ", "OUT"];
  const DIAS = { LU:0, MA:1, MI:2, JU:3, VI:4, SA:5, DO:6 };

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const opClock = document.getElementById('opClock');

  // ---------- Utilidades de parseo (traducidas de la query M) ----------

  function esVacio(v){ return v === null || v === undefined || String(v).trim() === ''; }

  function esPosicionVigente(pos, anioActual){
    const limpio = String(pos ?? '').trim();
    const basura = CODIGOS_EXCLUIDOS.includes(limpio.toUpperCase());
    const larga = limpio.length > 10;
    let anioRot = null;
    const prefijo = parseInt(limpio.substring(0,2), 10);
    if(!isNaN(prefijo)) anioRot = 2000 + prefijo;

    if(basura) return false;
    if(!larga) return true;
    return anioRot === anioActual || anioRot === anioActual - 1;
  }

  function mondayIndex(date){
    // Lunes=0 ... Domingo=6
    return (date.getDay() + 6) % 7;
  }

  function parseDiscon(valor){
    const txt = String(valor ?? '').trim();
    if(txt.length !== 10) return null;
    const yy = parseInt(txt.substring(0,2),10);
    const mm = parseInt(txt.substring(2,2+2),10);
    const dd = parseInt(txt.substring(4,4+2),10);
    const hh = parseInt(txt.substring(6,6+2),10);
    const mi = parseInt(txt.substring(8,8+2),10);
    if([yy,mm,dd,hh,mi].some(isNaN)) return null;
    return new Date(2000+yy, mm-1, dd, hh, mi, 0);
  }

  function parseHoraSimple(valor, ahora){
    const txt = String(valor ?? '').trim();
    if(txt.length < 6) return null;
    const codigoDia = txt.substring(0,2).toUpperCase();
    const sufijo = txt.substring(txt.length-4);
    const hh = parseInt(sufijo.substring(0,2),10);
    const mi = parseInt(sufijo.substring(2,2+2),10);
    const diaObjetivo = DIAS.hasOwnProperty(codigoDia) ? DIAS[codigoDia] : null;

    const valido = diaObjetivo !== null && !isNaN(hh) && !isNaN(mi) && hh>=0 && hh<=23 && mi>=0 && mi<=59;
    if(!valido) return null;

    const hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
    let offsetMatch = 0;
    for(let o=0; o<=6; o++){
      const candidatoDia = new Date(hoy);
      candidatoDia.setDate(hoy.getDate()-o);
      if(mondayIndex(candidatoDia) === diaObjetivo){ offsetMatch = o; break; }
    }
    const fechaBase = new Date(hoy);
    fechaBase.setDate(hoy.getDate()-offsetMatch);
    let candidato = new Date(fechaBase.getFullYear(), fechaBase.getMonth(), fechaBase.getDate(), hh, mi, 0);
    if(candidato > ahora){
      candidato = new Date(candidato.getTime() - 7*24*60*60*1000);
    }
    return candidato;
  }

  function formatearHHMM(diffMs){
    if(diffMs === null || diffMs === undefined) return null;
    const totalMin = Math.round(diffMs/60000);
    const horas = Math.floor(totalMin/60);
    const minutos = totalMin % 60;
    return String(horas).padStart(2,'0') + ':' + String(minutos).padStart(2,'0');
  }

  // ---------- TSV parsing ----------

  function parseTSV(text){
    const lines = text.replace(/\r/g,'').split('\n');
    if(lines.length === 0) return [];
    const headers = lines[0].split('\t').map(h => h.trim());
    const rows = [];
    for(let i=1;i<lines.length;i++){
      const line = lines[i];
      if(!line || !line.includes('\t')) continue;
      const cells = line.split('\t');
      const row = {};
      headers.forEach((h,idx) => row[h] = (cells[idx] ?? '').trim());
      rows.push(row);
    }
    return rows;
  }

  // ---------- Lógica principal (traducción de la query) ----------

  function calcularFila(fila, ahora, anioActual){
    const powerTxt = String(fila['Power'] ?? '');
    const seMovio = powerTxt.includes('(') ? 'Sí' : 'No';
    const powerNum = parseInt(powerTxt.replace(/[()]/g,'').trim(), 10) || 0;

    const posActual = String(fila['Current Position'] ?? '').trim();
    const discon = fila['Discon'];
    const remarks = fila['Remarks'];
    const yardPlan = fila['Yard Plan'];
    const kind = String(fila['Kind'] ?? '').trim();
    const moveStage = String(fila['Move Stage'] ?? '').trim();

    let instancia;
    if(posActual.startsWith('*TR')){
      instancia = 'SOBRE CAMION';
    } else if(posActual.length > 10){
      if(kind === 'DSCH') instancia = 'DESCARGA';
      else if(kind === 'LOAD') instancia = 'EMBARCADO SIN CONEX';
      else instancia = 'EMBARCADO SIN CONEXION (revisar)';
    } else {
      if(kind === 'DSCH'){
        instancia = 'DESCARGA';
      } else if(esVacio(discon)){
        instancia = esVacio(remarks) ? 'CALLE' : 'CALLE REVISAR';
      } else {
        if(!esVacio(yardPlan)) instancia = 'MOVIMIENTO';
        else if(moveStage === 'Completed') instancia = 'MOVIMIENTO';
        else {
          if(powerNum === 0 && kind === 'LOAD') instancia = 'EMBARQUE';
          else if(powerNum === 0) instancia = 'DESPACHO';
          else instancia = 'SIN CLASIFICAR';
        }
      }
    }

    const usaDiscon = ['MOVIMIENTO','EMBARQUE','DESPACHO','SOBRE CAMION','SIN CLASIFICAR','DESCARGA'].includes(instancia);
    const usaYardIn = ['CALLE','CALLE REVISAR'].includes(instancia);
    const usaComplete = ['EMBARCADO SIN CONEX','EMBARCADO SIN CONEXION (revisar)'].includes(instancia);

    let fechaEvento = null;
    if(usaDiscon) fechaEvento = parseDiscon(discon);
    else if(usaYardIn) fechaEvento = parseHoraSimple(fila['Yard In'], ahora);
    else if(usaComplete) fechaEvento = parseHoraSimple(fila['Complete'], ahora);

    const tiempoTranscurrido = fechaEvento ? formatearHHMM(ahora - fechaEvento) : null;
    const tiempoMin = fechaEvento ? Math.round((ahora - fechaEvento)/60000) : null;
    const alerta = instancia === 'SIN CLASIFICAR' ? 'Revisar' : null;

    return {
      Contenedor: fila['Container No.'],
      Nave: fila['Outbound Carrier Name'],
      Posicion: posActual,
      Instancia: instancia,
      Tiempo: tiempoTranscurrido,
      TiempoMin: tiempoMin,
      ReqsPower: seMovio,
      Alerta: alerta,
      Remarks: remarks
    };
  }

  function procesar(text){
    const ahora = new Date();
    const anioActual = ahora.getFullYear();
    const rows = parseTSV(text);

    const filasValidas = rows.filter(r => !esVacio(r['Container No.']));
    const sinBasura = filasValidas.filter(r => esPosicionVigente(r['Current Position'], anioActual));
    const calculadas = sinBasura.map(r => calcularFila(r, ahora, anioActual));
    const filtradas = calculadas.filter(r => !String(r.Remarks ?? '').toUpperCase().includes('NO CONECTAR'));

    return filtradas;
  }

  // ---------- Render ----------

  function pillTiempo(tiempo, minutos){
    if(!tiempo) return '<span class="badge">—</span>';
    let cls = 'pill-yellow';
    if(minutos >= 60) cls = 'pill-red';
    else if(minutos < 10) cls = 'pill-green';
    return `<span class="pill ${cls}">${tiempo}</span>`;
  }

  function badgeInstancia(inst){
    const map = {
      'DESCARGA':'badge-descarga', 'CALLE':'badge-calle', 'CALLE REVISAR':'badge-revisar',
      'EMBARQUE':'badge-embarque', 'MOVIMIENTO':'badge-movimiento', 'DESPACHO':'badge-movimiento',
      'SOBRE CAMION':'badge-calle', 'SIN CLASIFICAR':'badge-revisar'
    };
    const cls = map[inst] || '';
    return `<span class="badge ${cls}">${inst}</span>`;
  }

  function esc(v){
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderGeneral(rows){
    const container = document.getElementById('tableGeneral');
    const data = rows.filter(r => !['EMBARCADO SIN CONEX','EMBARCADO SIN CONEXION (revisar)','EMBARQUE'].includes(r.Instancia));
    document.getElementById('countGeneral').textContent = data.length;

    if(data.length === 0){ container.innerHTML = '<div class="empty-state">sin registros</div>'; return; }

    let html = '<table><thead><tr><th>Contenedor</th><th>Instancia</th><th>Posición</th><th>Nave</th><th>Tiempo</th></tr></thead><tbody>';
    data.sort((a,b)=> (b.TiempoMin??0) - (a.TiempoMin??0)).forEach(r => {
      html += `<tr><td>${esc(r.Contenedor)}</td><td>${badgeInstancia(r.Instancia)}</td><td>${esc(r.Posicion)}</td><td>${esc(r.Nave)}</td><td>${pillTiempo(r.Tiempo, r.TiempoMin)}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderSinConexion(rows){
    const container = document.getElementById('tableSinConexion');
    const data = rows.filter(r => ['EMBARCADO SIN CONEX','EMBARCADO SIN CONEXION (revisar)'].includes(r.Instancia));
    document.getElementById('countSinConexion').textContent = data.length;

    if(data.length === 0){ container.innerHTML = '<div class="empty-state">sin unidades a bordo sin conexión</div>'; return; }

    let html = '<table><thead><tr><th>Contenedor</th><th>Nave</th><th>Tiempo</th><th>Posición</th></tr></thead><tbody>';
    data.sort((a,b)=> (b.TiempoMin??0) - (a.TiempoMin??0)).forEach(r => {
      html += `<tr><td>${esc(r.Contenedor)}</td><td>${esc(r.Nave)}</td><td>${pillTiempo(r.Tiempo, r.TiempoMin)}</td><td>${esc(r.Posicion)}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderEmbarque(rows){
    const container = document.getElementById('tableEmbarque');
    const data = rows.filter(r => r.Instancia === 'EMBARQUE');
    document.getElementById('countEmbarque').textContent = data.length;

    if(data.length === 0){ container.innerHTML = '<div class="empty-state">sin unidades desconectadas para embarque</div>'; return; }

    let html = '<table><thead><tr><th>Contenedor</th><th>Nave</th><th>Tiempo</th></tr></thead><tbody>';
    data.sort((a,b)=> (b.TiempoMin??0) - (a.TiempoMin??0)).forEach(r => {
      html += `<tr><td>${esc(r.Contenedor)}</td><td>${esc(r.Nave)}</td><td>${pillTiempo(r.Tiempo, r.TiempoMin)}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  async function fetchData(){
    try{
      const url = `${RAW_URL}?t=${Date.now()}`;
      const res = await fetch(url, { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();

      const rows = procesar(text);
      renderGeneral(rows);
      renderSinConexion(rows);
      renderEmbarque(rows);

      statusDot.classList.remove('offline');
      statusText.textContent = 'en vivo';

      const lastModifiedHeader = res.headers.get('last-modified');
      const fileDate = lastModifiedHeader ? new Date(lastModifiedHeader) : null;

      if(fileDate){
        opClock.textContent = 'ARCHIVO ACTUALIZADO ' + fileDate.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + fileDate.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      } else {
        const now = new Date();
        opClock.textContent = 'VERIFICADO ' + now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' (sin fecha de archivo disponible)';
      }

    }catch(err){
      statusDot.classList.add('offline');
      statusText.textContent = 'sin conexión';
      console.error(err);
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_MS);
</script>

</body>
</html>
